name: Render vertical Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: HTTPS download URL or Google Drive share URL for authorized source video
        required: true
        type: string
      config_path:
        description: Repository path to a JSON metadata config
        required: true
        default: clips.json
        type: string

permissions:
  contents: read

concurrency:
  group: reel-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Validate URL and download authorized input
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VIDEO_URL"
          python - <<'PY'
          import os, urllib.parse
          url = urllib.parse.urlparse(os.environ['VIDEO_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password:
              raise SystemExit('Use a valid HTTPS URL without embedded username/password')
          PY
          python - <<'PY'
          import os, pathlib, urllib.parse, subprocess
          import gdown
          url = os.environ['VIDEO_URL']
          host = (urllib.parse.urlparse(url).hostname or '').lower()
          output = 'input-video'
          if host == 'drive.google.com' or host.endswith('.drive.google.com'):
              result = gdown.download(url, output=output, quiet=False, fuzzy=True)
              if not result:
                  raise SystemExit('Google Drive download failed; check sharing and retry its share URL.')
          else:
              subprocess.run([
                  'curl', '--proto', '=https', '--proto-redir', '=https',
                  '--fail', '--location', '--silent', '--show-error',
                  '--max-time', '1800', '--max-filesize', '5000000000',
                  url, '--output', output
              ], check=True)
          path = pathlib.Path(output)
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('Download produced an empty file')
          if path.stat().st_size > 5_000_000_000:
              raise SystemExit('Input video exceeds the 5 GB limit')
          PY

      - name: Render full video and posting notes
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          test -f "$CONFIG_PATH"
          python reel_renderer.py --video input-video --config "$CONFIG_PATH" --hook-queue hooks.txt --run-number "$GITHUB_RUN_NUMBER" --output-dir reels

      - name: Upload outputs to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-package-${{ github.run_number }}
          path: reels/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload outputs to Google Drive
        if: ${{ vars.DRIVE_UPLOAD_ENABLED == 'true' }}
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
          DRIVE_DESTINATION: ${{ vars.DRIVE_DESTINATION }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ] || [ -z "$DRIVE_DESTINATION" ]; then
            echo "Drive upload is enabled, but the secret or destination variable is missing." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes rclone
          config="$RUNNER_TEMP/rclone.conf"
          trap 'rm -f "$config"' EXIT
          umask 077
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$config"
          RCLONE_CONFIG="$config" rclone copy reels "$DRIVE_DESTINATION" --transfers 2 --checkers 2

